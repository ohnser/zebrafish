<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>zebrafish.cc</title>
<style>
  :root {
    --bg: #eaf4fb;
    --bg2: #d6ecf9;
    --line: rgba(30, 110, 160, 0.18);
    --text: #12313f;
    --muted: #5c8aa3;
    --scale: #2f8fc0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 30% 20%, var(--bg2), var(--bg) 70%);
    color: var(--text);
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* faint drifting scale/ripple texture, evoking water */
  body::before {
    content: '';
    position: fixed;
    inset: -10%;
    background-image:
      radial-gradient(circle, var(--scale) 0.5px, transparent 0.5px);
    background-size: 26px 26px;
    opacity: 0.06;
    animation: drift 40s linear infinite;
  }
  @keyframes drift {
    from { transform: translate(0, 0); }
    to { transform: translate(-26px, -26px); }
  }

  .wrap {
    position: relative;
    text-align: center;
    padding: 40px;
  }

  .brand {
    font-size: clamp(40px, 9vw, 96px);
    font-weight: 500;
    letter-spacing: -0.02em;
    color: var(--text);
    line-height: 1;
  }

  .brand .dot { color: var(--scale); }

  .rule {
    width: 64px;
    height: 1px;
    background: var(--line);
    margin: 28px auto;
  }

  .contact {
    font-family: Arial, sans-serif;
    font-size: 15px;
    letter-spacing: 0.02em;
  }

  .contact a {
    color: var(--muted);
    text-decoration: none;
    border-bottom: 1px solid var(--line);
    padding-bottom: 2px;
    transition: color 0.25s ease, border-color 0.25s ease;
  }

  .contact a:hover {
    color: var(--scale);
    border-color: var(--scale);
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="brand">zebrafish<span class="dot">.</span>cc</div>
  <div class="rule"></div>
  <div class="contact"><a href="mailto:ad@zebrafish.cc">ad@zebrafish.cc</a></div>
</div>

</body>
</html>
